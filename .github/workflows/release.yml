name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      build_name: ${{ steps.version.outputs.build_name }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.7
          cache: true
      - run: flutter pub get
      # The tag is the app version's source of truth; pubspec.yaml
      # carries only a dev placeholder.
      - name: Derive and validate version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No leading zeros: bash $(( )) would read them as octal.
          SEMVER='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          NAME="${GITHUB_REF_NAME#v}"
          if ! echo "$NAME" | grep -qE "$SEMVER"; then
            echo "::error::Tag $GITHUB_REF_NAME must be vMAJOR.MINOR.PATCH without leading zeros"
            exit 1
          fi
          IFS=. read -r MAJ MIN PAT <<< "$NAME"
          # versionCode = MAJ*10000 + MIN*100 + PAT stays monotonic only
          # while minor and patch fit two digits.
          if [ "$MIN" -gt 99 ] || [ "$PAT" -gt 99 ]; then
            echo "::error::minor/patch must be <= 99 for the versionCode scheme"
            exit 1
          fi
          CODE=$((10#$MAJ*10000 + 10#$MIN*100 + 10#$PAT))

          # Android refuses over-the-top installs (the in-app updater's
          # whole mechanism) unless versionCode strictly increases. Only
          # a 404 (no previous release) may skip this guard; any other
          # gh failure must not silently disable it.
          set +e
          PREV=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>&1)
          GH_STATUS=$?
          set -e
          if [ "$GH_STATUS" -ne 0 ]; then
            if echo "$PREV" | grep -q 'HTTP 404'; then
              echo "::warning::No previous release; skipping the versionCode monotonicity check."
              PREV=""
            else
              echo "::error::Could not query the previous release: $PREV"
              exit 1
            fi
          fi
          if [ "$PREV" = "$GITHUB_REF_NAME" ]; then
            echo "::notice::Tag $GITHUB_REF_NAME is already the latest release; skipping the monotonicity check."
          elif [ -n "$PREV" ]; then
            P="${PREV#v}"
            if echo "$P" | grep -qE "$SEMVER"; then
              IFS=. read -r PM PN PP <<< "$P"
              PCODE=$((10#$PM*10000 + 10#$PN*100 + 10#$PP))
              if [ "$CODE" -le "$PCODE" ]; then
                echo "::error::versionCode $CODE does not exceed previous release $PREV ($PCODE)"
                exit 1
              fi
            else
              echo "::warning::Previous release tag $PREV is not vMAJOR.MINOR.PATCH; skipping the monotonicity check."
            fi
          fi
          echo "build_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$CODE" >> "$GITHUB_OUTPUT"
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android release artifacts
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # `secrets` is not usable in step `if` expressions; bridge via env.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.7
          cache: true
      - run: flutter pub get

      # Optional release signing: provide these repository secrets to ship
      # a store-uploadable build. Without them the artifacts fall back to
      # the debug key and are explicitly labeled as such.
      - name: Configure signing
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          {
            printf 'storeFile=../release.keystore\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK and app bundle
        env:
          BUILD_NAME: ${{ needs.verify.outputs.build_name }}
          BUILD_NUMBER: ${{ needs.verify.outputs.build_number }}
        run: |
          flutter build apk --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          flutter build appbundle --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          if [ "$HAS_KEYSTORE" = "true" ]; then SUFFIX=""; else SUFFIX="-debugsigned"; fi
          cp build/app/outputs/flutter-apk/app-release.apk "dist/meme-library-${GITHUB_REF_NAME}${SUFFIX}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/meme-library-${GITHUB_REF_NAME}${SUFFIX}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*
          if-no-files-found: error

  ios:
    name: iOS unsigned archive
    needs: verify
    runs-on: macos-15
    timeout-minutes: 45
    # The iOS artifact is unsigned by design (sideloading only); its
    # failure must not block the Android release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.7
          cache: true
      - run: flutter pub get
      - name: Build unsigned iOS app
        env:
          BUILD_NAME: ${{ needs.verify.outputs.build_name }}
          BUILD_NUMBER: ${{ needs.verify.outputs.build_number }}
        run: flutter build ios --release --no-codesign --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload dist
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr "dist/meme-library-${GITHUB_REF_NAME}-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [android, ios]
    # Run when android succeeded, even if the optional ios job failed.
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Meme Library $GITHUB_REF_NAME" \
            --generate-notes
