name: meme_library
description: A local-first library for saving and reusing memes.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  archive: ^4.0.9
  crypto: ^3.0.7
  drift: ^2.34.3
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  http: ^1.6.0
  image: ^4.9.1
  meta: ^1.17.0
  path: ^1.9.1
  path_provider: ^2.1.6
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
