name: meme_library
description: A local-first library for saving and reusing memes.
publish_to: none
# Dev placeholder — do not bump; mirrored as devPlaceholderVersionName in
# lib/src/update/app_update_service.dart. Release builds are stamped from
# the git tag by .github/workflows/release.yml.
version: 0.0.1+1

environment:
  sdk: ^3.11.0

dependencies:
  archive: ^4.0.9
  crypto: ^3.0.7
  drift: ^2.34.3
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  http: ^1.6.0
  image: ^4.9.1
  # Android photo picker only. iOS goes through PHPickerViewController on
  # the platform channel instead: image_picker_ios re-encodes every result
  # through UIImage, which flattens APNG and animated WebP and re-times
  # animated GIFs.
  image_picker: ^1.2.3
  # Direct dependencies so `useAndroidPhotoPicker` can be set; it is a
  # property on the platform implementation, not a call-site option, and
  # reaching it needs both the impl and the interface.
  image_picker_android: ^0.8.13
  image_picker_platform_interface: ^2.11.1
  meta: ^1.17.0
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#4A2FD6"
  adaptive_icon_foreground: assets/icon/app_icon_fg.png
